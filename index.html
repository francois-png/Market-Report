// ═══ TOWN DETAIL ═══

function TownDetail({townId}) {
  const [tab,setTab] = useState("overview");
  const [propFilter,setPropFilter] = useState("all");
  const [constFilter,setConstFilter] = useState("all");
  const [salesVisible,setSalesVisible] = useState({hNBs:true,hSHs:true,fNBs:true,fSHs:true});
  const toggleSales = (key) => setSalesVisible(prev=>({...prev,[key]:!prev[key]}));

  const TD = TOWNS[townId]; const M = TD.municipal; const FL = TD.flags;
  const foreignData = TD.foreignBuyers ? TD.foreignBuyers.breakdown : FOREIGN.breakdown;
  const foreignMaxTotal = Math.max(...foreignData.map(f=>f.total));
  const hasTownForeign = !!TD.foreignBuyers;
  const totalSales = getTotalSales(M);
  const hTotal = (M.housesNB.sales||0)+(M.housesSH.sales||0);
  const fTotal = (M.flatsNB.sales||0)+(M.flatsSH.sales||0);
  const tabs = [{id:"overview",label:"Overview"},{id:"compare",label:"New vs Second Hand"},{id:"trends",label:"Province Trends"},{id:"buyers",label:"Buyer Profile"},{id:"data",label:"Data Table"}];

  const getChartLines = () => {
    const lines=[]; const sH=propFilter==="all"||propFilter==="houses"; const sF=propFilter==="all"||propFilter==="flats";
    const sN=constFilter==="all"||constFilter==="nb"; const sS=constFilter==="all"||constFilter==="sh";
    if(sH&&sN) lines.push({key:"hNBp",name:"Houses · New Build",color:T.housesNB});
    if(sH&&sS) lines.push({key:"hSHp",name:"Houses · 2nd Hand",color:T.housesSH});
    if(sF&&sN) lines.push({key:"fNBp",name:"Flats · New Build",color:T.flatsNB});
    if(sF&&sS) lines.push({key:"fSHp",name:"Flats · 2nd Hand",color:T.flatsSH});
    return lines;
  };
  const priceLines = getChartLines();
  const yearlyMerged = useMemo(()=>[2021,2022,2023,2024,2025].map((y,i)=>({year:String(y),hNBp:YEARLY.houses.nb[i].priceM2,hSHp:YEARLY.houses.sh[i].priceM2,fNBp:YEARLY.flats.nb[i].priceM2,fSHp:YEARLY.flats.sh[i].priceM2,hNBs:YEARLY.houses.nb[i].sales,hSHs:YEARLY.houses.sh[i].sales,fNBs:YEARLY.flats.nb[i].sales,fSHs:YEARLY.flats.sh[i].sales,hNBa:YEARLY.houses.nb[i].avgPrice,hSHa:YEARLY.houses.sh[i].avgPrice,fNBa:YEARLY.flats.nb[i].avgPrice,fSHa:YEARLY.flats.sh[i].avgPrice})),[]);

  const localPriceBars = [];
  if(FL.hasHousesNBPriceData&&M.housesNB.priceM2) localPriceBars.push({label:"Houses · New Build",val:M.housesNB.priceM2,color:T.housesNB});
  if(M.housesSH.priceM2) localPriceBars.push({label:"Houses · 2nd Hand",val:M.housesSH.priceM2,color:T.housesSH});
  if(FL.hasFlatsNBMunicipalData&&M.flatsNB.priceM2) localPriceBars.push({label:"Flats · New Build",val:M.flatsNB.priceM2,color:T.flatsNB});
  if(M.flatsSH.priceM2) localPriceBars.push({label:"Flats · 2nd Hand",val:M.flatsSH.priceM2,color:T.flatsSH});
  const maxLP = Math.max(...localPriceBars.map(b=>b.val),1);

  const pieData=[]; const pieClr=[]; const pieLeg=[];
  const addPie=(sales,label,color)=>{if(sales){pieData.push({value:sales});pieClr.push(color);pieLeg.push({label,val:sales,color});}};
  addPie(M.housesNB.sales,"Houses · NB",T.housesNB); addPie(M.housesSH.sales,"Houses · SH",T.housesSH);
  addPie(M.flatsNB.sales,"Flats · NB",T.flatsNB); addPie(M.flatsSH.sales,"Flats · SH",T.flatsSH);

  const shareItems=[];
  if(M.housesNB.sales) shareItems.push({label:"Houses · NB",local:M.housesNB.sales,prov:PROVINCE_TOTALS.housesNB,color:T.housesNB});
  shareItems.push({label:"Houses · SH",local:M.housesSH.sales||0,prov:PROVINCE_TOTALS.housesSH,color:T.housesSH});
  if(FL.hasFlatsNBData&&M.flatsNB.sales) shareItems.push({label:"Flats · NB",local:M.flatsNB.sales,prov:PROVINCE_TOTALS.flatsNB,color:T.flatsNB});
  shareItems.push({label:"Flats · SH",local:M.flatsSH.sales||0,prov:PROVINCE_TOTALS.flatsSH,color:T.flatsSH});

  const overviewStats=[];
  overviewStats.push({label:"Total Sales",value:totalSales,sub:[hTotal>0&&`Houses: ${hTotal}`,fTotal>0&&`Flats: ${fTotal}`].filter(Boolean).join(" · "),color:TD.color});
  if(FL.hasHousesNBPriceData&&M.housesNB.avgAmount) overviewStats.push({label:"Houses NB · Avg Price",value:fmtEur(M.housesNB.avgAmount),sub:`€${fmt(M.housesNB.priceM2)}/m² · ${M.housesNB.avgSurface} m² avg · ${M.housesNB.sales} sales`,color:T.housesNB});
  if(M.housesSH.avgAmount) overviewStats.push({label:"Houses SH · Avg Price",value:fmtEur(M.housesSH.avgAmount),sub:`€${fmt(M.housesSH.priceM2)}/m² · ${M.housesSH.avgSurface} m² avg · ${M.housesSH.sales} sales`,color:T.housesSH});
  if(FL.hasFlatsNBMunicipalData&&M.flatsNB.avgAmount) overviewStats.push({label:"Flats NB · Avg Price",value:fmtEur(M.flatsNB.avgAmount),sub:`€${fmt(M.flatsNB.priceM2)}/m² · ${M.flatsNB.avgSurface} m² avg · ${M.flatsNB.sales} sales`,color:T.flatsNB});
  if(M.flatsSH.avgAmount) overviewStats.push({label:"Flats SH · Avg Price",value:fmtEur(M.flatsSH.avgAmount),sub:`€${fmt(M.flatsSH.priceM2)}/m² · ${M.flatsSH.avgSurface} m² avg · ${M.flatsSH.sales} sales`,color:T.flatsSH});

  const hvf = TD.comparisons.housesVsFlats;
  const fd = (v) => `${v>=0?"+":""}${v.toFixed(1).replace('.',',')}%`;
  const hvfItems=[
    {label:"Price per m²",hVal:hvf.hPriceM2,fVal:hvf.fPriceM2,hFmt:`€${fmt(hvf.hPriceM2)}`,fFmt:`€${fmt(hvf.fPriceM2)}`,diff:fd(hvf.priceDiffPct),higher:hvf.priceDiffPct>=0},
    {label:"Average Amount",hVal:hvf.hAvg,fVal:hvf.fAvg,hFmt:`€${fmt(hvf.hAvg)}`,fFmt:`€${fmt(hvf.fAvg)}`,diff:fd(hvf.avgDiffPct),higher:hvf.avgDiffPct>=0},
    {label:"Avg Surface",hVal:hvf.hSurf,fVal:hvf.fSurf,hFmt:`${hvf.hSurf} m²`,fFmt:`${hvf.fSurf} m²`,diff:fd(hvf.surfDiffPct),higher:hvf.surfDiffPct>=0},
  ];

  const tableRows=[];
  if(M.housesNB.sales) tableRows.push({cat:"Houses · New Build",...M.housesNB,color:T.housesNB});
  tableRows.push({cat:"Houses · 2nd Hand",...M.housesSH,color:T.housesSH});
  if(FL.hasFlatsNBData&&M.flatsNB.sales) tableRows.push({cat:"Flats · New Build",...M.flatsNB,color:T.flatsNB});
  tableRows.push({cat:"Flats · 2nd Hand",...M.flatsSH,color:T.flatsSH});

  const missingNotes=[];
  if(!FL.hasHousesNBPriceData) missingNotes.push(`Houses NB: ${M.housesNB.sales?`Only ${M.housesNB.sales} sale${M.housesNB.sales!==1?"s":""}`:  "No data"}`);
  if(!FL.hasFlatsNBMunicipalData&&!FL.hasFlatsNBData) missingNotes.push("Flats NB: No data");
  else if(!FL.hasFlatsNBMunicipalData&&M.flatsNB.sales) missingNotes.push(`Flats NB: Only ${M.flatsNB.sales} sale`);

  return (
    <div style={{padding:"24px 32px 60px",maxWidth:1160,margin:"0 auto"}}>
      <div style={{display:"flex",gap:0,marginBottom:8,borderBottom:`1px solid ${T.border}`,marginTop:-4}}>
        {tabs.map(t=>(<button key={t.id} onClick={()=>setTab(t.id)} style={{padding:"10px 20px",border:"none",cursor:"pointer",fontSize:12,fontWeight:600,fontFamily:font,background:"transparent",color:tab===t.id?T.text:T.muted,borderBottom:tab===t.id?`2.5px solid ${TD.color}`:"2.5px solid transparent",transition:"all 0.2s"}}>{t.label}</button>))}
      </div>

      {tab==="overview"&&<>
        <Section sub="Municipal level · All construction types">{TD.name} at a Glance</Section>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit, minmax(220px, 1fr))",gap:12}}>
          {overviewStats.map((s,i)=><Stat key={i} large label={s.label} value={s.value} sub={s.sub} color={s.color}/>)}
        </div>
        <Card style={{marginTop:14}}>
          <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:14}}><p style={{color:T.muted,fontSize:10,textTransform:"uppercase",letterSpacing:1.2,fontWeight:600}}>{TD.nameShort}'s Share of Illes Balears Province</p><Badge color={T.slate}>Dec 2024 – Nov 2025</Badge></div>

        <div style={{display:"flex",flexDirection:"column",gap:14}}>

            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {[
                {label:"Price Growth (Island-wide)",val:FORECAST_2026.priceGrowthIsland,color:T.olive},

      <div style={{marginTop:32,padding:"14px 18px",background:T.card,border:`1px solid ${T.border}`,borderRadius:10,display:"flex",alignItems:"flex-start",gap:12}}>

        <div>
          <p style={{color:T.textMid,fontSize:11,lineHeight:1.5}}>Foreign buyer demand data from <strong style={{color:T.text}}>Spanish Notaries, Registrars, INE, IBESTAT</strong>. Agency data from <strong style={{color:T.text}}>Engel & Völkers</strong> (Market Report 2024/25 & H1 2025). Online metrics from <strong style={{color:T.text}}>Idealista, Kyero, Rightmove Overseas</strong>. Travel data from <strong style={{color:T.text}}>AENA, Turespaña, Travelgate</strong>.</p>
          <p style={{color:T.dim,fontSize:10,marginTop:4}}>Report current as of February 2026. Property market data subject to revision by issuing authorities.</p>
        </div>
      </div>
    </div>

}
